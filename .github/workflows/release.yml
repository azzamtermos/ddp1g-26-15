name: Build & Release Rapihin Aja

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Biar bisa dites manual dari tab Actions tanpa bikin Release

permissions:
  contents: write

jobs:
  test:
    name: Jalankan Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Jalankan pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  build-linux:
    name: Build Linux (.deb amd64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang dependensi & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build paket .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
      - name: Simpan artefak Linux
        uses: actions/upload-artifact@v4
        with:
          name: rapihin-aja-linux-deb
          path: dist/*.deb

  build-windows:
    name: Build Windows (.zip)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang dependensi & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable Windows
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --noconsole --name rapihin-aja `
            --icon="assets\icon.ico" `
            --add-data "data;data" `
            --add-data "ui\styles.qss;ui" `
            --add-data "assets;assets" `
            main.py
          Compress-Archive -Path "dist\rapihin-aja" -DestinationPath "dist\rapihin-aja-windows-x64.zip"
      - name: Simpan artefak Windows
        uses: actions/upload-artifact@v4
        with:
          name: rapihin-aja-windows-zip
          path: dist/rapihin-aja-windows-x64.zip

  build-macos:
    name: Build macOS (.zip Apple Silicon)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang dependensi & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Build aplikasi macOS (.app)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Rapihin Aja" \
            --icon="assets/icon.png" \
            --add-data "data:data" \
            --add-data "ui/styles.qss:ui" \
            --add-data "assets:assets" \
            main.py
          ditto -c -k --keepParent "dist/Rapihin Aja.app" "dist/rapihin-aja-macos-arm64.zip"
      - name: Simpan artefak macOS
        uses: actions/upload-artifact@v4
        with:
          name: rapihin-aja-macos-zip
          path: dist/rapihin-aja-macos-arm64.zip

  release:
    name: Terbitkan GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Unduh semua artefak build
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publikasikan Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
